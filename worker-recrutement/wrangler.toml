# Relais « Feedback d'entretien de recrutement » (Cloudflare Worker) — même principe que worker/ et worker-coach/
name = "ia-for-good-coach-recrutement"
main = "src/index.js"
compatibility_date = "2024-09-23"

[vars]
DUST_BASE_URL = "https://dust.tt"
# Même espace Dust que le Décodeur et Le Bon Angle
DUST_WORKSPACE_ID = "LiNKoSV40F"
# Identifiant de l'agent « feedback d'entretien de recrutement » (analyse un entretien passé)
DUST_AGENT_ID = "MGNgxPhNpG"
ALLOWED_ORIGINS = "https://aiforgood.page,https://www.aiforgood.page,https://almosnishirley.github.io,http://localhost:8000"
PAYHIP_MAX_USES = "1"

# Compteur des codes à quota (QUOTA_CODES)
[[kv_namespaces]]
binding = "USAGE"
id = "5d9fad8713194a89a532ae1b261aaad1"

# Secrets — jamais dans ce fichier (npx wrangler secret put <NOM> depuis worker-recrutement/) :
#   DUST_API_KEY, ACCESS_CODE, TESTER_CODES, PAYHIP_SECRET,
#   QUOTA_CODES (codes à nombre d'analyses limité : "CODE1=5,CODE2=3")
